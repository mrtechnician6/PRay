<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Girl</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="Kasari ❤️ _yabeshthapa _nepalivibes🌸🌸 _lyrics _moomin(MP3).mp3" type="audio/mpeg">
    </audio>

    <div id="overlay">
        <div class="intro-content">
            <h1>Hey Beautiful...</h1>
            <p>I built something special for you.</p>
            <button onclick="startExperience()">Open Your Surprise</button>
        </div>
    </div>

    <div class="container" id="mainContent">
        <section class="page" id="page1">
            <div class="glass-card">
                <h2>Our Story Began...</h2>
                <p>From the moment we met, everything changed. You aren't just my partner; you're my best friend.</p>
                <div class="scroll-hint">Scroll Down ↓</div>
            </div>
        </section>

        <section class="page" id="page2">
            <div class="glass-card">
                <h2>The Favorite Moments</h2>
                <div class="photo-grid">
                    <div class="photo-frame">❤️</div>
                    <div class="photo-frame">✨</div>
                    <div class="photo-frame">💍</div>
                </div>
            </div>
        </section>

        <section class="page" id="page3">
            <div class="glass-card final-card">
                <h1 class="proposal-text">Will You Be Mine Forever?</h1>
                <div class="btn-group">
                    <button class="yes-btn" onclick="celebrate()">YES</button>
                    <button class="yes-btn" id="moveBtn">YES!</button>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
